name: CI

on:
  push:
    branches: [main]
  # Sin filtro de rama base: los PRs apilados (fase-2 sobre fase-1, etc.)
  # también tienen que pasar typecheck, lint y tests antes de llegar a main.
  pull_request:

# Una corrida por rama: un push nuevo cancela la corrida anterior de la MISMA
# rama (PR o branch), nunca la de otra. En main no se cancela: cada commit que
# llega a producción queda verificado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # La suite corre contra un Supabase EFÍMERO levantado en el runner
    # (Postgres + Auth + PostgREST + Storage) con todas las migraciones de
    # supabase/migrations/ aplicadas en orden. Ningún test toca producción
    # (hallazgos COD-07 / FN-02, auditoría 360 del 18-oct-2026): este job no
    # recibe ningún secret, y tests/setup/guard-produccion.ts aborta la
    # corrida si alguna variable de conexión apunta al proyecto real.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Escribe PG*/SUPABASE_* de la base local en $GITHUB_ENV.
      - name: Levantar base efímera y aplicar migraciones
        run: bash scripts/test-db/start.sh
      - run: npm test
