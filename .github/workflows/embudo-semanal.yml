name: Embudo semanal (disparo de respaldo)

# Respaldo de Vercel Cron (vercel.json, minuto 12). El endpoint solo envía el
# lunes de 12:00 a 16:59 hora de Chile y Resend deduplica por semana, así que
# el doble disparo no repite el correo.
on:
  schedule:
    - cron: "42 15-20 * * 1"
  workflow_dispatch: {}

concurrency:
  group: embudo-semanal
  cancel-in-progress: false

jobs:
  disparar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Llamar a /api/embudo-semanal
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://esmalia.com' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::error::Falta el secret CRON_SECRET"; exit 1; fi
          status=$(curl -sS -o respuesta.txt -w "%{http_code}" --retry 3 --retry-delay 20 --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/embudo-semanal")
          echo "HTTP $status"; head -c 300 respuesta.txt; echo
          [ "$status" = "200" ] || { echo "::error::embudo-semanal respondió $status"; exit 1; }
